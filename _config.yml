url: ""
baseurl: ""
permalink: /publication/:title/
excerpt_separator: "<!--more-->"

collections:
  sections:
    output: false
  talks:
    output: false

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - ROLLBACK.sh
  - VERIFICATION.txt
  - DIFF_FILE.patch
  - scripts
  - package.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - artifacts
  - _templates
